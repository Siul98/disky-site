name: Prepare public website
on:
  push:
    paths: ['.github/workflows/prepare-site.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import website files without application source or history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://api.github.com/repos/Siul98/disky-web/tarball/d7b1c95bb2c05b8a416c929004238585ba3ef9dc -o /tmp/site.tar.gz
          mkdir /tmp/site
          tar -xzf /tmp/site.tar.gz -C /tmp/site --strip-components=1
          python3 - <<'PY'
          import pathlib, shutil
          source=pathlib.Path('/tmp/site')
          allowed_dirs={'assets','fonts','brand'}
          allowed_files={'.nojekyll','index.html','contact.html','rechtliches.html','screen-app.html','latest.json','robots.txt','sitemap.xml','favicon.svg','favicon.png','favicon-16.png','favicon-32.png','apple-touch-icon.png','og.png','og.jpg','_demoseed.js'}
          for child in source.iterdir():
              if child.is_symlink(): raise RuntimeError('Unexpected symlink')
              if child.is_dir() and child.name in allowed_dirs:
                  shutil.copytree(child,child.name,dirs_exist_ok=True)
              elif child.is_file() and child.name in allowed_files:
                  shutil.copy2(child,child.name)
          for p in pathlib.Path('.').rglob('*'):
              if '.git' in p.parts or '.github' in p.parts or not p.is_file(): continue
              if p.suffix in {'.html','.json','.js','.xml','.txt'}:
                  text=p.read_text()
                  text=text.replace('github.com/Siul98/disky-web/releases/','github.com/Siul98/disky-site/releases/')
                  p.write_text(text)
          assert not pathlib.Path('app').exists()
          assert not pathlib.Path('CNAME').exists()
          assert pathlib.Path('index.html').exists()
          pathlib.Path('.nojekyll').touch()
          pathlib.Path('README.md').write_text('# DISKY website\n\nPublic website assets and installer downloads only. Application source, backend code and credentials are maintained separately. All rights reserved.\n')
          PY
          curl --fail --location --retry 3 https://github.com/Siul98/disky-web/releases/download/v0.1.0-beta/DISKY-0.1.0.dmg -o /tmp/DISKY-0.1.0.dmg
          echo '1cf776a18ebbb96dd6e86228323166bd8336bfb2d79b1ee942184cdb0a6c8a23  /tmp/DISKY-0.1.0.dmg' | sha256sum --check
          git config user.name 'DISKY website deployment'
          git config user.email 'noreply@disky.app'
          git add .
          git diff --cached --quiet || git commit -m 'Publish website assets without application history'
          git push origin HEAD:main
          if ! gh release view v0.1.0-beta >/dev/null 2>&1; then
            gh release create v0.1.0-beta /tmp/DISKY-0.1.0.dmg --title 'Disky 0.1.0 — Beta' --notes 'Original beta installer, unchanged. SHA-256: 1cf776a18ebbb96dd6e86228323166bd8336bfb2d79b1ee942184cdb0a6c8a23. This is the existing beta, not a new production release.'
          fi
