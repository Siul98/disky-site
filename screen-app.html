<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/app-brand.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090d14;color:#edf2fa;font-family:Arial,sans-serif}.shell{display:grid;grid-template-columns:19% 1fr;height:100%;overflow:hidden}aside{background:#0c121e;border-right:1px solid #253247;padding:8% 7%;font-size:clamp(8px,1.1vw,15px)}aside img{width:80%;margin:10% 0 24%}nav div{padding:9% 5%;color:#a5b0c1;white-space:nowrap}nav .selected{background:#192738;color:#fff;border-radius:8px}.scan{margin-top:15%;padding:12% 4%;text-align:center;background:linear-gradient(145deg,#5a97ac,#142553);border:1px solid #6793ac;border-radius:9px}main{min-width:0;padding:4% 3%;overflow:hidden}disky-demo{display:block;width:100%;height:100%}
</style><div class="shell"><aside><img src="assets/logo/disky-wortmarke.svg" alt="DISKY"><nav><div>Overview</div><div class="selected">⌕ Deep Search</div><div>Storage Map</div><div>WorldMap</div><div>Duplicate Finder</div><div>Gather & Transfer</div><div>Features</div></nav><div class="scan">Scan a drive</div></aside><main><disky-demo view="search" mode="screen" manual-start></disky-demo></main></div><script type="module">
import './assets/app-demo.js';
const demo=document.querySelector('disky-demo');demo.setAttribute('lang',new URLSearchParams(location.search).get('lang')==='de'?'de':'en');
let visible=false,requested=false;function update(){demo.active=visible;demo.shadowRoot.querySelector('.demo')?.classList.toggle('playing',visible);if(visible&&requested&&!demo.started)demo.startSearch()}
addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;if(typeof e.data?.diskyVis==='boolean')visible=e.data.diskyVis;if(e.data?.diskyDemo==='search')requested=true;update()});
if(parent===window){visible=true;requested=true;update()}
await document.fonts.ready;parent.postMessage({diskyReady:1},location.origin);
</script></html>
