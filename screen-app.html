<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DISKY — recorded app demo</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d17}img,video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .22s ease} .on{opacity:1}@media(prefers-reduced-motion:reduce){img,video{transition:none}}</style></head><body><script>
// Real renderer recording: actual input events, catalog search and 3D animation.
// Keep the real app recording running while its host is visible.
const lang=new URLSearchParams(location.search).get('lang')==='de'?'de':'en';document.documentElement.lang=lang;
const still=new Image();still.alt='DISKY — Deep Search';still.src='assets/app/search-start-'+lang+'.webp';still.className='on';document.body.append(still);
const movie=document.createElement('video');movie.muted=true;movie.defaultMuted=true;movie.loop=true;movie.playsInline=true;movie.preload='auto';movie.setAttribute('muted','');movie.setAttribute('playsinline','');movie.setAttribute('aria-label','Recorded DISKY search with demo catalog');movie.poster='assets/app/search-start-'+lang+'.webp';document.body.append(movie);
let visible=false,search=false,loaded=false,pending=false;
function playback(){
  if(!visible||!search||document.hidden){movie.pause();return}
  if(pending||!movie.paused)return;
  pending=true;
  let interrupted=false;
  movie.play().catch(error=>{
    interrupted=error.name==='AbortError';
    // AbortError is expected if the visitor leaves while decoding.
    if(error.name!=='AbortError'){
      console.warn('DISKY preview playback:',error.name);
      parent.postMessage({diskyPlaybackBlocked:true},location.origin);
    }
  }).finally(()=>{
    pending=false;
    // A visibility change may interrupt play while the next play request is pending.
    if(interrupted&&visible&&search&&!document.hidden)playback();
  });
}
function showSearch(){search=true;if(!loaded){loaded=true;movie.src='assets/app/search-'+lang+'.webm?v=20260907-typing';movie.load()}playback()}
movie.addEventListener('playing',()=>{
  if(search){movie.classList.add('on');still.classList.remove('on')}
  parent.postMessage({diskyPlaybackBlocked:false},location.origin);
});
movie.addEventListener('canplay',playback);
movie.addEventListener('error',()=>{
  console.warn('DISKY preview media error:',movie.error?.code);
  parent.postMessage({diskyPlaybackBlocked:true},location.origin);
});
addEventListener('visibilitychange',playback);
addEventListener('pageshow',playback);
addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;const m=e.data||{};if(typeof m.diskyVis==='boolean'){visible=m.diskyVis;playback()}if(m.diskyDemo==='search'||m.diskyView==='search')showSearch();else if(m.diskyView==='overview'){search=false;movie.pause();movie.classList.remove('on');still.classList.add('on')}});
still.decode().catch(()=>{}).then(()=>parent.postMessage({diskyReady:1},location.origin));
</script></body></html>
